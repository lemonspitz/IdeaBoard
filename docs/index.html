<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Idea Board</title>
<style>
:root{
  --bg:#f3f3ef; --dot:#cdcdc5; --panel:#ffffff; --line:#e4e4de; --ink:#1f1f1c; --muted:#6c6c66;
  --hover:#f0f0ec; --accent:#4f5bd5; --accent-soft:#e7e9fb; --frame-bg:#ffffff; --frame-line:#d6d6d0;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px -6px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1b1d; --dot:#3a3a3e; --panel:#2a2a2e; --line:#3b3b40; --ink:#ececec; --muted:#9b9ba1;
    --hover:#35353a; --accent:#8d95ff; --accent-soft:#353966; --frame-bg:#252528; --frame-line:#46464c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
  }
}
:root[data-theme="dark"]{
  --bg:#1b1b1d; --dot:#3a3a3e; --panel:#2a2a2e; --line:#3b3b40; --ink:#ececec; --muted:#9b9ba1;
  --hover:#35353a; --accent:#8d95ff; --accent-soft:#353966; --frame-bg:#252528; --frame-line:#46464c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background-color:var(--bg);
  background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.4px)}
#stage.nogrid{background-image:none}
#stage.t-hand,#stage.panning{cursor:grab}
#stage.grabbing{cursor:grabbing}
#stage.t-create,#stage.t-pen,#stage.t-connector{cursor:crosshair}
#stage.t-eraser{cursor:cell}
#stage.t-text{cursor:text}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.item{position:absolute}
.cell{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;outline:none;min-height:1.25em;width:100%;cursor:inherit}
.txt[contenteditable]{-webkit-user-select:text;user-select:text;cursor:text}
.sticky{border-radius:3px;box-shadow:0 1px 1px rgba(0,0,0,.08),0 8px 16px -8px rgba(0,0,0,.35)}
.sticky .cell{padding:16px}
.sticky .txt,.shape .txt{text-align:center;color:#1f1f1c;line-height:1.25}
.sticky .txt{font-weight:500}
.shape svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.shape .cell{padding:10px 14px}
.shape.ellipse .cell{padding:16% 18%}
.shape.diamond .cell{padding:24% 26%}
.text .txt{line-height:1.3;padding:2px 0}
.frame{background:var(--frame-bg);border:1px solid var(--frame-line);border-radius:4px}
.frame .ftitle{position:absolute;left:0;bottom:100%;padding-bottom:calc(6px * var(--iz,1));
  font-size:calc(13px * var(--iz,1));font-weight:500;color:var(--muted);white-space:pre;width:auto;min-width:40px}
.image img{width:100%;height:100%;display:block;pointer-events:none;border-radius:2px}
svg.vec{position:absolute;overflow:visible;pointer-events:none}
svg.vec .hit{fill:none;stroke:transparent;pointer-events:stroke}
svg.vec .stroke{fill:none;stroke-linecap:round;stroke-linejoin:round}
#overlay{position:absolute;inset:0;pointer-events:none}
.selbox{position:absolute;border:1.5px solid var(--accent);border-radius:2px}
.selbox.group{border-style:dashed}
.selbox.hover{border:2px solid var(--accent);opacity:.6;border-radius:4px}
.handle{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;background:#fff;border:1.5px solid var(--accent);border-radius:50%;pointer-events:auto}
.handle[data-h=nw],.handle[data-h=se]{cursor:nwse-resize}
.handle[data-h=ne],.handle[data-h=sw]{cursor:nesw-resize}
.handle.end{cursor:move;width:13px;height:13px;margin:-6.5px 0 0 -6.5px}
.marquee{position:absolute;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.ovsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

#ui{position:fixed;inset:0;pointer-events:none}
.panel{position:absolute;pointer-events:auto;background:var(--panel);border-radius:12px;box-shadow:var(--shadow)}
.panel button{appearance:none;border:0;background:transparent;color:var(--ink);border-radius:8px;cursor:pointer;
  display:grid;place-items:center;min-width:36px;height:36px;padding:0 8px;font:inherit}
.panel button:hover{background:var(--hover)}
.panel button.on{background:var(--accent-soft);color:var(--accent)}
.panel button:disabled{opacity:.35;cursor:default;background:transparent}
.sep{width:1px;align-self:stretch;margin:6px 3px;background:var(--line)}
.hsep{height:1px;margin:3px 6px;background:var(--line)}
#tools{left:12px;top:50%;transform:translateY(-50%);padding:5px;display:flex;flex-direction:column;gap:2px}
#tools button{width:38px;height:38px;padding:0}
#top{left:12px;top:12px;display:flex;align-items:center;gap:2px;padding:5px}
#logo{width:28px;height:28px;border-radius:8px;margin:0 4px 0 2px;flex:none;
  background:linear-gradient(135deg,#ffd54f 0 50%,#4f5bd5 50%)}
#name{border:0;background:transparent;color:var(--ink);font:600 15px/1 inherit;padding:8px 6px;border-radius:6px;width:200px;outline:none}
#name:hover{background:var(--hover)}
#name:focus{background:var(--hover);box-shadow:0 0 0 2px var(--accent-soft)}
#zoom{right:12px;bottom:12px;display:flex;align-items:center;gap:2px;padding:5px}
#zoompct{min-width:56px;font-variant-numeric:tabular-nums;font-size:13px}
#penbar{left:62px;top:50%;transform:translateY(-50%);padding:6px;display:none;flex-direction:column;gap:4px;align-items:center}
#penbar.show{display:flex}
#menu{left:12px;top:60px;padding:5px;min-width:220px;display:none;z-index:10;max-height:calc(100% - 72px);overflow-y:auto}
#menu.show{display:block}
#menu button{display:flex;justify-content:space-between;width:100%;height:32px;padding:0 10px;gap:24px}
#menu .k{color:var(--muted);font-size:12px}
#menu .lbl{font-size:11px;font-weight:600;color:var(--muted);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.04em}
#ctx{display:none;align-items:center;gap:1px;padding:4px;transform:translate(-50%,calc(-100% - 12px))}
#ctx.show{display:flex}
#ctx.below{transform:translate(-50%,12px)}
#ctx button{min-width:32px;height:32px;padding:0 6px}
.sw{width:22px!important;min-width:22px!important;height:22px!important;padding:0!important;margin:0 2px;border-radius:50%!important;
  background:var(--c)!important;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw.clear{background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/8px 8px!important}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.wd{width:30px}
.wd i{display:block;width:16px;border-radius:9px;background:var(--ink)}
#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);pointer-events:none;line-height:1.7}
#hint b{color:var(--ink);font-size:20px;font-weight:600;display:block;margin-bottom:6px}
#hint kbd{font:12px ui-monospace,Menlo,monospace;background:var(--panel);box-shadow:var(--shadow);padding:2px 6px;border-radius:5px;margin:0 2px}
#clip{position:fixed;left:-9999px;top:0;width:10px;height:10px;opacity:0}
#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:8px 14px;font-size:13px;display:none}
#toast.show{display:block}
#topright{right:12px;top:12px;display:flex;align-items:center;gap:8px;padding:5px}
#sharebtn{display:flex;align-items:center}
#people{display:flex;padding-left:4px}
#people:empty{display:none}
#people span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600;
  margin-left:-6px;box-shadow:0 0 0 2px var(--panel);cursor:default}
#people span:first-child{margin-left:0}
.panel button.primary{background:var(--accent);color:#fff;font-weight:600;padding:0 14px}
.panel button.primary:hover{background:var(--accent);filter:brightness(1.1)}
.live-dot{width:8px;height:8px;border-radius:50%;background:#43a047;display:inline-block;margin-right:7px;box-shadow:0 0 0 3px rgba(67,160,71,.3)}
#sharepanel{right:12px;top:60px;width:min(330px,calc(100% - 24px));padding:16px;display:none;z-index:10}
#sharepanel.show{display:block}
#sharepanel h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center}
#sharepanel p{margin:0 0 12px;color:var(--muted);font-size:12.5px;line-height:1.45}
#sharepanel p.note{margin:14px 0 0;font-size:11.5px}
#sharepanel label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
#sharepanel input{width:100%;height:36px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;
  padding:0 10px;font:inherit;outline:none;-webkit-user-select:text;user-select:text}
#sharepanel input:focus{border-color:var(--accent)}
#sharepanel .row{display:flex;gap:6px;align-items:center}
#sharepanel .row input{flex:1;min-width:0}
#sharepanel .wide{width:100%;margin-top:12px}
#sharepanel button:not(.primary){background:var(--hover)}
#sharepanel .or{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin:16px 0 8px}
#sharepanel .or::before,#sharepanel .or::after{content:'';flex:1;height:1px;background:var(--line)}
#sharepanel ul{list-style:none;margin:0;padding:0}
#sharepanel li{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
#sharepanel li i{width:10px;height:10px;border-radius:50%;flex:none}
#sharepanel em{color:var(--muted);font-style:normal}
.code{font:600 19px ui-monospace,Menlo,monospace;letter-spacing:.14em;-webkit-user-select:text;user-select:text}
#cursors{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rcur{position:absolute;left:0;top:0;transition:transform .09s linear}
.rcur svg{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.rcur span{position:absolute;left:14px;top:17px;color:#fff;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.rsel{position:absolute;border:2px solid;border-radius:3px;opacity:.85}
.acct{width:32px!important;min-width:32px!important;height:32px!important;padding:0!important;border-radius:50%!important;
  background:var(--accent-soft)!important;color:var(--accent)!important;font-weight:700;font-size:12px}
#acctmenu{right:12px;top:60px;min-width:240px;padding:6px;display:none;z-index:11}
#acctmenu.show{display:block}
#acctmenu .who{padding:8px 10px 6px;display:flex;flex-direction:column}
#acctmenu .who span{color:var(--muted);font-size:12.5px}
#acctmenu button{width:100%;justify-content:flex-start;display:flex;height:34px;padding:0 10px}
#boards{left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 24px));max-height:min(620px,calc(100% - 40px));
  display:none;flex-direction:column;padding:16px;z-index:12}
#boards.show{display:flex}
#boards .bhead{display:flex;align-items:center;justify-content:space-between}
#boards h3{margin:0;font-size:17px}
#boards .tabs{display:flex;gap:4px;margin:12px 0 8px;border-bottom:1px solid var(--line)}
#boards .tabs button{border-radius:8px 8px 0 0;height:34px;color:var(--muted)}
#boards .tabs button.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent);background:transparent}
#boards ul{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:120px}
#boards li{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;cursor:pointer}
#boards li:hover{background:var(--hover)}
#boards li.cur{background:var(--accent-soft)}
#boards li>div{flex:1;min-width:0;display:flex;flex-direction:column}
#boards li b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#boards li span{color:var(--muted);font-size:12px}
#boards li.empty{color:var(--muted);cursor:default;font-size:13px;line-height:1.5}
#boards li.empty:hover{background:transparent}
#boards li button{opacity:0;color:var(--muted)}
#boards li:hover button{opacity:1}
#boards .bfoot{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--line);margin-top:8px;flex-wrap:wrap}
#boards .bfoot button:not(.primary){background:var(--hover)}
#sharepanel li .x{margin-left:auto;min-width:24px;height:24px;padding:0;background:transparent!important;color:var(--muted)}
#auth{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;padding:16px;
  background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#auth.show{display:flex}
#auth .card{position:relative;width:min(400px,100%);padding:28px 28px 22px;border-radius:16px}
#auth .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:16px}
#auth .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#ffd54f 0 50%,#4f5bd5 50%)}
#auth h2{margin:0 0 6px;font-size:22px}
#auth .sub{margin:0 0 16px;color:var(--muted);font-size:13.5px;line-height:1.5}
#auth .center{text-align:center;margin:20px 0}
#auth .ok{background:var(--accent-soft);color:var(--ink);padding:8px 10px;border-radius:8px;font-size:13px;margin:0 0 12px}
#auth label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 12px}
#auth label em{font-style:normal;opacity:.8}
#auth input{display:block;width:100%;height:40px;margin-top:5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:9px;padding:0 12px;font:inherit;font-size:15px;outline:none;-webkit-user-select:text;user-select:text}
#auth input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#auth .err{color:#d32f2f;font-size:13px;min-height:18px;margin:-2px 0 8px}
#auth button.wide{width:100%;height:42px;margin-top:6px;font-size:14.5px}
#auth button:not(.primary){background:var(--hover)}
#auth .links{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:16px;font-size:13px;color:var(--muted)}
#auth a{color:var(--accent);text-decoration:none;font-weight:500}
#auth a:hover{text-decoration:underline}
@media (max-width:640px){
  #name{width:110px}
  #top .sep,#undobtn,#redobtn{display:none}
  #people span:nth-child(n+4){display:none}
  #tools{top:auto;bottom:12px;left:50%;transform:translateX(-50%);flex-direction:row;max-width:calc(100% - 24px);overflow-x:auto}
  #tools .hsep{width:1px;height:auto;margin:6px 3px}
  #zoom{bottom:72px}
  #penbar{left:50%;top:auto;bottom:66px;transform:translateX(-50%);flex-direction:row}
}
</style>
</head>
<body>
<div id="stage" class="t-select">
  <div id="world"></div>
  <div id="overlay"></div>
  <div id="cursors"></div>
  <div id="hint"><b>Your board is empty</b>Double-click anywhere to add a sticky note<br>
    <kbd>N</kbd> sticky <kbd>R</kbd> shape <kbd>T</kbd> text <kbd>L</kbd> connector <kbd>P</kbd> pen <kbd>F</kbd> frame<br>
    Scroll to pan · pinch or ⌘-scroll to zoom · hold <kbd>Space</kbd> to drag the view</div>
</div>
<div id="ui">
  <div id="top" class="panel">
    <div id="logo"></div>
    <input id="name" spellcheck="false" value="Untitled board" aria-label="Board name">
    <button id="menubtn" title="Menu"></button>
    <div class="sep"></div>
    <button id="undobtn" title="Undo (⌘Z)"></button>
    <button id="redobtn" title="Redo (⇧⌘Z)"></button>
  </div>
  <div id="topright" class="panel"><div id="people"></div><button id="sharebtn" class="primary">Share</button><button id="acctbtn" class="acct" hidden></button></div>
  <div id="acctmenu" class="panel"></div>
  <div id="boards" class="panel"></div>
  <div id="sharepanel" class="panel"></div>
  <div id="menu" class="panel"></div>
  <div id="tools" class="panel"></div>
  <div id="penbar" class="panel"></div>
  <div id="ctx" class="panel"></div>
  <div id="zoom" class="panel">
    <button id="zout" title="Zoom out (⌘−)"></button>
    <button id="zoompct" title="Reset to 100% (⌘0)">100%</button>
    <button id="zin" title="Zoom in (⌘+)"></button>
    <div class="sep"></div>
    <button id="zfit" title="Zoom to fit (⇧1)"></button>
    <button id="zgrid" title="Toggle grid (G)"></button>
  </div>
  <div id="toast" class="panel"></div>
</div>
<div id="auth"></div>
<textarea id="clip" aria-hidden="true" tabindex="-1"></textarea>
<input id="filein" type="file" accept=".ideaboard,.json,application/json" hidden>
<input id="imgin" type="file" accept="image/*" multiple hidden>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const SVGNS = 'http://www.w3.org/2000/svg';
const stage = $('#stage'), world = $('#world'), overlay = $('#overlay'), ctxBar = $('#ctx'), clip = $('#clip');
const NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.board);
const post = msg => { if (NATIVE) window.webkit.messageHandlers.board.postMessage(msg); };

const STICKY = ['#fff59d','#ffd180','#ffab91','#f8bbd0','#e1bee7','#b3e5fc','#b2dfdb','#c5e1a5','#eeeeee'];
const FILLS  = ['#ffffff','transparent','#fff59d','#ffd180','#f8bbd0','#b3e5fc','#c5e1a5','#e1bee7','#455a64'];
const INKS   = ['','#e53935','#fb8c00','#f9a825','#43a047','#1e88e5','#8e24aa','#9e9e9e'];
const SIZES  = [10,12,14,16,18,20,24,28,32,40,48,56,64,80,96,120];
const TEXTY  = new Set(['sticky','text','rect','ellipse','diamond','frame']);
const SHAPES = new Set(['rect','ellipse','diamond']);
const EXT = 'ideaboard';

// ---------- Firebase settings ----------
// Paste your Firebase web-app config here (Project settings → Your apps). It is public by design;
// access is enforced by the database rules in firebase/database.rules.json.
const FIREBASE_CONFIG = null;
const FB_VER = '10.14.1';
const EMU = /[?&]emulator=1/.test(location.search) || !!window.__IDEABOARD_EMULATOR;
const fbConfig = EMU
  ? { apiKey: 'demo-key', authDomain: 'demo-ideaboard.firebaseapp.com', projectId: 'demo-ideaboard', databaseURL: 'http://127.0.0.1:9000/?ns=demo-ideaboard-default-rtdb' }
  : (window.__IDEABOARD_FIREBASE || FIREBASE_CONFIG);
const CLOUD = !!(fbConfig && fbConfig.apiKey);
const cloud = {
  on: false, id: null, role: null, user: null, auth: null, db: null, listeners: [], presenceRef: null,
  blobs: new Map(), uploaded: new Set(), z: new Map(), meta: null, members: {}, pendingBoard: null, pendingJoin: null,
};

const ICON = {
  select:'<path d="M5 3.5l10.5 6-4.6 1.4L8.6 15.5z"/>',
  hand:'<path d="M7.2 10.5V5.2a1.2 1.2 0 012.4 0v4.3M9.6 9V3.9a1.2 1.2 0 012.4 0V9M12 9.2V5a1.2 1.2 0 012.4 0v6.4c0 3.3-2.3 5.6-5.4 5.6-2 0-3.2-.8-4.3-2.4L3.2 11.7a1.2 1.2 0 012-1.3l2 2.3"/>',
  sticky:'<path d="M4 4h12v7.5L11.5 16H4z"/><path d="M11.5 16v-4.5H16"/>',
  text:'<path d="M5 5.5V4h10v1.5M10 4v12M8 16h4"/>',
  rect:'<rect x="3.5" y="5" width="13" height="10" rx="1.5"/>',
  ellipse:'<ellipse cx="10" cy="10" rx="7" ry="5.5"/>',
  diamond:'<path d="M10 3l7 7-7 7-7-7z"/>',
  connector:'<path d="M4.5 15.5L15.5 4.5M9.5 4.5h6v6"/>',
  pen:'<path d="M13.5 3.5l3 3L7 16H4v-3z"/><path d="M11.5 5.5l3 3"/>',
  eraser:'<path d="M9 16h7M3.6 12.4l7-7a1.5 1.5 0 012.1 0l2.4 2.4a1.5 1.5 0 010 2.1L9.6 16H7.2z"/><path d="M7 9l4 4"/>',
  frame:'<path d="M6 3v14M14 3v14M3 6h14M3 14h14"/>',
  image:'<rect x="3" y="4" width="14" height="12" rx="1.5"/><circle cx="7.5" cy="8.3" r="1.3"/><path d="M3.5 14l4-4 3 3 2-2 4 4"/>',
  undo:'<path d="M7 5L3.5 8.5 7 12"/><path d="M4 8.5h7.5a4.5 4.5 0 010 9H9"/>',
  redo:'<path d="M13 5l3.5 3.5L13 12"/><path d="M16 8.5H8.5a4.5 4.5 0 000 9H11"/>',

function addImages(files, at) {
  let i = 0;
  pushUndo();
  for (const f of files) {
    const k = i++;
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        let src = rd.result;
        const big = Math.max(img.width, img.height);
        if (big > 1600 || src.length > 1500000) {
          // Keep boards light (they travel between peers): cap at 1600px.
          const k = Math.min(1, 1600 / big), cv = document.createElement('canvas');
          cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          src = f.type === 'image/png' ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.85);
          if (src.length > 1500000) src = cv.toDataURL('image/jpeg', 0.8);
        }
        const s = Math.min(1, 640 / Math.max(img.width, img.height));
        const w = Math.max(24, img.width * s), h = Math.max(24, img.height * s);
        add({ type: 'image', src, x: r1(at.x - w / 2 + k * 30), y: r1(at.y - h / 2 + k * 30), w: r1(w), h: r1(h) });
        setTool('select'); changed();

  }
}

function wrapLines(c, text, maxW) {

        if (c.measureText(test).width > maxW && !line) {

    out.push(line.trimEnd());

}

  up[`${base}/meta/updated`] = TS();
  if (cloud.role === 'owner') up[`userBoards/${cloud.user.uid}/${id}/updated`] = TS();
  cloud.db.ref().update(up).catch(x => { clog('cloud write ' + x.message); toast("Couldn't save to the cloud: " + (x.message || x)); });
}
let presT = 0;
function cloudCursor(e) {
  const now = performance.now(); if (now - presT < 90 || !cloud.presenceRef) return; presT = now;
  const p = toWorld(e.clientX, e.clientY);
  cloud.presenceRef.update({ x: r1(p.x), y: r1(p.y), sel: [...sel].slice(0, 50), gone: false, name: identity.name }).catch(() => {});
}
async function inviteEmail(email) {
  email = String(email || '').trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast("That email address doesn't look right."); return false; }
  if (email === cloud.user.email.toLowerCase()) { toast("That's you — you already have access."); return false; }
  const k = ekey(email), id = cloud.id;
  try {
    await cloud.db.ref().update({
      [`boards/${id}/members/${k}`]: { email, added: TS() },
      [`sharedWith/${k}/${id}`]: { name: boardName, ownerEmail: cloud.user.email, ownerName: identity.name, added: TS() },
    });
    toast(email + ' can now open this board. Send them the link.');
    return true;
  } catch (x) { toast("Couldn't invite: " + (x.message || x)); return false; }
}
async function removeMember(k) {
  try { await cloud.db.ref().update({ [`boards/${cloud.id}/members/${k}`]: null, [`sharedWith/${k}/${cloud.id}`]: null }); }
  catch (x) { toast("Couldn't remove: " + (x.message || x)); }
}

// ---------- public API (used by the Mac app) ----------
window.app = {
  serialize, load, exportPNG, newBoard, undo, redo, selectAll, fit: () => fit(), zoomIn, zoomOut, zoomReset, toggleGrid,
  deleteSelection: deleteSel, duplicate: duplicateSel, isDirty: () => dirty, name: () => boardName,
  markSaved(name) { if (name) { boardName = name; $('#name').value = name; } setDirty(false); autosave(); },
  setDirty(v) { dirty = !v; setDirty(!!v); },
  addImageData(dataURL) { const img = new Image(); img.onload = () => { pushUndo(); const p = toWorld(innerWidth / 2, innerHeight / 2), s = Math.min(1, 640 / Math.max(img.width, img.height)); add({ type: 'image', src: dataURL, x: r1(p.x - img.width * s / 2), y: r1(p.y - img.height * s / 2), w: r1(img.width * s), h: r1(img.height * s) }); changed(); }; img.src = dataURL; },
  join: (code, confirmed) => joinSession(code, confirmed),
  showBoards: () => CLOUD && cloud.user ? showBoards() : toast('Sign in to see your boards'),
  openBoard: id => openCloud(id),
  signOut: () => cloud.auth && cloud.auth.signOut(),
  _cloud: () => ({ enabled: CLOUD, user: cloud.user ? cloud.user.email : null, verified: !!(cloud.user && cloud.user.emailVerified), on: cloud.on, id: cloud.id, role: cloud.role, n: items.length }),
  _signIn: (e, p) => cloud.auth.signInWithEmailAndPassword(e, p).then(() => 'ok', x => x.code),
  openShare: () => { renderShare(); showShare(true); },
  leaveSession: () => leaveSession(false),
  inSession: () => collab.on ? collab.role : '',
  _state: () => ({ items, sel: [...sel], view, tool, editingId, undo: undoStack.length,
    live: collab.on, role: collab.role, code: collab.code, people: peopleList().map(p => p.name), connecting: collab.connecting }),
};

// ---------- boot ----------
buildPenbar(); setTool('select'); $('#zgrid').classList.add('on');
let initial = window.__IDEABOARD_INITIAL || null;
if (!initial && !NATIVE) try { initial = localStorage.getItem('ideaboard.autosave'); } catch (e) {}
if (initial) { load(initial); if (window.__IDEABOARD_DIRTY) setDirty(true); } else render();
renderShare();
const hashBoard = location.hash.match(/board=([-\w]{6,40})/);
if (hashBoard) { cloud.pendingBoard = hashBoard[1]; history.replaceState(null, '', location.pathname + location.search); }
const hashJoin = location.hash.match(/join=([a-z0-9]{6,16})/i);
if (hashJoin && CLOUD) { cloud.pendingJoin = hashJoin[1].toLowerCase(); history.replaceState(null, '', location.pathname + location.search); }
initCloud();
if (hashJoin && !CLOUD) {
  collab.prefill = hashJoin[1].toLowerCase();
  history.replaceState(null, '', location.pathname + location.search);
  renderShare(); showShare(true);
  joinSession(collab.prefill); // name is remembered (or picked automatically), so join right away
} else refocus();
})();
</script>
